<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Sentry Watch &mdash; Digital Banking Fraud Investigation Platform</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="toast-region" class="toast-region" aria-live="polite"></div>

<div class="app-shell">

  <!-- SIDEBAR -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 32 32" width="22" height="22"><circle cx="16" cy="16" r="10" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="16" cy="16" r="4" fill="currentColor"/><circle cx="16" cy="16" r="14.5" fill="none" stroke="currentColor" stroke-width="1" opacity="0.4"/></svg>
      </span>
      <div class="brand-text" style="margin-left:45px">
        <span class="brand-name">Sentry Watch</span>
        <span class="brand-sub">Fraud Investigation</span>
      </div>
    </div>

    <nav class="sidebar-nav" id="sidebar-nav" aria-label="Primary">
      <div class="nav-group-label">Monitor</div>
      <a class="nav-link" data-route="dashboard" href="#/dashboard"><svg class="nav-icon" viewBox="0 0 20 20"><path d="M3 12l3-4 3 5 3-8 3 6 2-3" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Fraud Dashboard</span></a>
      <a class="nav-link" data-route="transactions" href="#/transactions" style="margin-left:55px"><svg class="nav-icon" viewBox="0 0 20 20"><rect x="3" y="5" width="14" height="10" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M3 8.5h14" stroke="currentColor" stroke-width="1.6"/></svg><span>Transactions</span></a>
      <a class="nav-link" data-route="customers" href="#/customers"><svg class="nav-icon" viewBox="0 0 20 20"><circle cx="10" cy="7" r="3" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M4 17c0-3.3 2.7-5.5 6-5.5s6 2.2 6 5.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg><span>Customer Accounts</span></a>
      <a class="nav-link" data-route="devices" href="#/devices"><svg class="nav-icon" viewBox="0 0 20 20"><rect x="6" y="2.5" width="8" height="15" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M9 14.5h2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg><span>Devices</span></a>

      <div class="nav-group-label">Respond</div>
      <a class="nav-link" data-route="alerts" href="#/alerts"><svg class="nav-icon" viewBox="0 0 20 20"><path d="M10 3.5C7-1 2 2.5 2 6.5c0 4.5 8 9.5 8 9.5s8-5 8-9.5c0-4-5-7.5-8-3z" fill="none" stroke="currentColor" stroke-width="1.6"/></svg><span>Fraud Alerts</span><span class="nav-count" id="nav-count-alerts"></span></a>
      <a class="nav-link" data-route="cases" href="#/cases"><svg class="nav-icon" viewBox="0 0 20 20"><rect x="3" y="6" width="14" height="10" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M7 6V4.8A1.8 1.8 0 018.8 3h2.4A1.8 1.8 0 0113 4.8V6" fill="none" stroke="currentColor" stroke-width="1.6"/></svg><span>Investigaton Cases</span><span class="nav-count" id="nav-count-cases"></span></a>
      <a class="nav-link" data-route="evidence" href="#/evidence"><svg class="nav-icon" viewBox="0 0 20 20"><path d="M3.5 5A1.5 1.5 0 015 3.5h3.5l2 2H15A1.5 1.5 0 0116.5 7v7.5A1.5 1.5 0 0115 16H5a1.5 1.5 0 01-1.5-1.5V5z" fill="none" stroke="currentColor" stroke-width="1.6"/></svg><span>Evidence Center</span></a>

      <div class="nav-group-label">Analyze</div>
      <a class="nav-link" data-route="risk" href="#/risk"><svg class="nav-icon" viewBox="0 0 20 20"><path d="M3 17V9M8.3 17V5M13.7 17v7M19 17V3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg><span>Risk Analysis</span></a>
      <a class="nav-link" data-route="reports" href="#/reports"><svg class="nav-icon" viewBox="0 0 20 20"><rect x="4" y="2.5" width="12" height="15" rx="1.2" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M7 6.5h6M7 9.5h6M7 12.5h4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg><span>Reports</span></a>
    </nav>

    <div class="sidebar-footer">
      <div class="sync-pill"><span class="pulse-dot"></span>Live monitoring active</div>
    </div>
  </aside>

  <!-- MAIN COLUMN -->
  <div class="main-col">

    <!-- TOP BAR -->
    <header class="topbar">
      <button class="icon-btn only-mobile" id="sidebar-toggle" aria-label="Toggle navigation">
        <svg viewBox="0 0 20 20" width="18" height="18"><path d="M3 5h14M3 10h14M3 15h14" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      </button>

      <div class="global-search">
        <svg viewBox="0 0 20 20" width="16" height="16" class="search-icon"><circle cx="8.5" cy="8.5" r="5.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M16 16l-3.5-3.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        <input type="text" id="global-search-input" placeholder="Search transactions, customers, accounts, devices, cases…" autocomplete="off">
        <kbd class="search-kbd">/</kbd>
        <div class="search-results" id="search-results" hidden></div>
      </div>

      <div class="topbar-actions">
        <div class="topbar-item" id="notif-wrap">
          <button class="icon-btn" id="notif-btn" aria-label="Notifications">
            <svg viewBox="0 0 20 20" width="18" height="18"><path d="M5 8a5 5 0 0110 0c0 3.2 1 4.5 1.5 5H3.5C4 12.5 5 11.2 5 8z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M8.2 15.5a1.8 1.8 0 003.6 0" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
            <span class="notif-dot" id="notif-dot" hidden></span>
          </button>
          <div class="notif-panel" id="notif-panel" hidden>
            <div class="notif-panel-head">
              <span>Notifications</span>
              <button class="link-btn" id="notif-mark-all">Mark all read</button>
            </div>
            <div class="notif-list" id="notif-list"></div>
          </div>
        </div>

        <div class="topbar-item">
          <div class="analyst-chip">
            <span class="avatar-dot">RM</span>
            <div class="analyst-meta">
              <span class="analyst-name">R. Mercer</span>
              <span class="analyst-role">Fraud Analyst II</span>
            </div>
          </div>
        </div>
      </div>
    </header>

    <!-- BREADCRUMB / PAGE HEAD -->
    <div class="page-head" id="page-head"></div>

    <!-- VIEW ROOT -->
    <main class="view-root" id="view-root"></main>

  </div>
</div>

<!-- DRAWER -->
<div class="drawer-overlay" id="drawer-overlay" hidden>
  <aside class="drawer" id="drawer" role="dialog" aria-modal="true">
    <div class="drawer-head">
      <div id="drawer-title"></div>
      <button class="icon-btn" id="drawer-close" aria-label="Close">
        <svg viewBox="0 0 20 20" width="16" height="16"><path d="M5 5l10 10M15 5L5 15" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>
    </div>
    <div class="drawer-body" id="drawer-body"></div>
  </aside>
</div>

<!-- MODAL -->
<div class="modal-overlay" id="modal-overlay" hidden>
  <div class="modal" id="modal" role="dialog" aria-modal="true">
    <div class="modal-head">
      <div id="modal-title"></div>
      <button class="icon-btn" id="modal-close" aria-label="Close">
        <svg viewBox="0 0 20 20" width="16" height="16"><path d="M5 5l10 10M15 5L5 15" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>
    </div>
    <div class="modal-body" id="modal-body"></div>
  </div>
</div>

<script src="script.js?v=2"></script>
</body>
</html>
